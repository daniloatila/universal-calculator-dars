name: DARS verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dars-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Check Rust formatting and core
        run: |
          cargo fmt --all --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
          cargo build --locked --release -p dars-cli
      - name: Prepare WebAssembly and frontend
        run: |
          node scripts/install-wasm-bindgen.mjs
      - name: Build WebAssembly and frontend
        run: |
          node scripts/build-wasm.mjs
          npm ci --prefix apps/web --ignore-scripts
          npm run build --prefix apps/web
          npm test --prefix apps/web
      - name: Compare native and WebAssembly against independent calculations
        if: runner.os != 'Windows'
        run: |
          python3 tests/oracle.py target/release/dars
          node tests/check-targets.mjs target/release/dars
          node tests/check-standard-record-targets.mjs target/release/dars
          node tests/check-scientific-targets.mjs target/release/dars
          node tests/check-algebra-targets.mjs target/release/dars
          node tests/check-calculus-targets.mjs target/release/dars
          node tests/check-linear-algebra-targets.mjs target/release/dars
          node tests/check-geometry-targets.mjs target/release/dars
          node tests/check-discrete-mathematics-targets.mjs target/release/dars
          node tests/check-programmer-targets.mjs target/release/dars
          node tests/check-converter-targets.mjs target/release/dars
          node tests/check-date-time-targets.mjs target/release/dars
          node tests/check-finance-targets.mjs target/release/dars
          node tests/check-finance-comparison-targets.mjs target/release/dars
          python3 -B crates/dars-core/tests/structured-oracle.py
      - name: Verify advanced mathematics with independent references
        if: runner.os == 'Linux'
        run: |
          python3 -m venv "$RUNNER_TEMP/dars-test-math"
          "$RUNNER_TEMP/dars-test-math/bin/python" -m pip install --only-binary=:all: --require-hashes -r tests/math-oracle-requirements.txt -r tests/linear-algebra-oracle-requirements.txt
          "$RUNNER_TEMP/dars-test-math/bin/python" -B tests/verify-scientific.py target/release/dars
          "$RUNNER_TEMP/dars-test-math/bin/python" -B tests/verify-scientific-complex.py target/release/dars
          "$RUNNER_TEMP/dars-test-math/bin/python" -B tests/verify-algebra.py target/release/dars
          "$RUNNER_TEMP/dars-test-math/bin/python" -B tests/verify-calculus.py target/release/dars
          "$RUNNER_TEMP/dars-test-math/bin/python" -B tests/verify-linear-algebra.py target/release/dars
          "$RUNNER_TEMP/dars-test-math/bin/python" -B tests/verify-geometry.py target/release/dars
          "$RUNNER_TEMP/dars-test-math/bin/python" -B tests/verify-discrete-mathematics.py target/release/dars
          "$RUNNER_TEMP/dars-test-math/bin/python" -B tests/verify-programmer.py target/release/dars
          "$RUNNER_TEMP/dars-test-math/bin/python" -B tests/verify-converter.py target/release/dars
          "$RUNNER_TEMP/dars-test-math/bin/python" -B tests/verify-date-time.py target/release/dars
          python3 -B tests/verify-financial-loans.py target/release/dars
          python3 -B tests/verify-investment-business.py target/release/dars
          python3 -B tests/verify-tax.py target/release/dars
          python3 -B tests/verify-finance-comparison.py target/release/dars
      - name: Measure financial line coverage from tests and independent oracles
        if: runner.os == 'Linux' && github.ref == 'refs/heads/codex/objective-04-finance-and-business'
        run: |
          rustup component add llvm-tools-preview
          cargo install cargo-llvm-cov --version 0.9.2 --locked
          cargo llvm-cov --locked --release --no-report -p dars-universal
          cargo llvm-cov run --locked --release --no-report -p dars-cli -- -V
          export LLVM_PROFILE_FILE="$PWD/target/llvm-cov-target/finance-revision-%p-%m.profraw"
          for suite in financial-loans investment-business tax finance-comparison; do
            python3 -B "tests/verify-$suite.py" target/llvm-cov-target/release/dars
          done
          cargo llvm-cov report --release --json --output-path "$RUNNER_TEMP/dars-finance-coverage.json"
          python3 -B tests/summarize-finance-coverage.py "$RUNNER_TEMP/dars-finance-coverage.json"
      - name: Browser verification (Linux)
        if: runner.os == 'Linux'
        working-directory: apps/web
        run: |
          npx --no-install playwright install --with-deps chromium
          npm run test:e2e
          node ../../tests/verify-web-offline.mjs
      - name: Build the Windows and macOS desktop targets
        if: runner.os != 'Linux'
        run: |
          cargo build --locked --release -p dars-desktop
          cargo test --locked -p dars-desktop
      - name: Verify Windows release lint and credential round trip
        if: runner.os == 'Windows'
        run: |
          cargo clippy --locked --workspace --release --all-targets -- -D warnings
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test --locked --release -p dars-desktop --lib -- --include-ignored
      - name: Write provenance for the Windows review executable
        if: runner.os == 'Windows' && (github.ref == 'refs/heads/codex/objective-03-universal-mathematics' || github.ref == 'refs/heads/codex/objective-04-finance-and-business')
        run: |
          $review = Join-Path $env:RUNNER_TEMP 'dars-windows-review'
          New-Item -ItemType Directory -Path $review | Out-Null
          $exe = Copy-Item target/release/dars-desktop.exe -Destination $review -PassThru
          $wasm = @(Get-ChildItem apps/web/dist/assets -File -Filter '*.wasm' | Sort-Object Name | ForEach-Object {
            [ordered]@{ name = $_.Name; sha256 = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() }
          })
          $expected = if ($env:GITHUB_REF -eq 'refs/heads/codex/objective-04-finance-and-business') { 15 } else { 10 }
          if ($wasm.Count -ne $expected) { throw "Expected $expected packed WASM modules" }
          [ordered]@{
            schema = 1
            commit = $env:GITHUB_SHA
            run_id = $env:GITHUB_RUN_ID
            run_attempt = $env:GITHUB_RUN_ATTEMPT
            target = 'windows-x64'
            bytes = $exe.Length
            sha256 = (Get-FileHash -LiteralPath $exe.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            packaged_wasm = $wasm
          } | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath (Join-Path $review 'provenance.json') -Encoding utf8
      - name: Exercise the review executable in hosted WebView2 when available
        if: runner.os == 'Windows' && github.ref == 'refs/heads/codex/objective-03-universal-mathematics'
        continue-on-error: true
        run: |
          $review = Join-Path $env:RUNNER_TEMP 'dars-windows-review'
          node scripts/verify-locale-revision.mjs (Join-Path $review 'dars-desktop.exe') (Join-Path $review 'hosted-locale-replay.json')
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node scripts/verify-desktop.mjs --objective-03-revision-01
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item artifacts/objective-03/revision-01/desktop-verification/windows-x64.json (Join-Path $review 'hosted-windows-ui.json')
      - name: Retain the Windows review executable for one day
        if: runner.os == 'Windows' && (github.ref == 'refs/heads/codex/objective-03-universal-mathematics' || github.ref == 'refs/heads/codex/objective-04-finance-and-business')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dars-windows-review
          path: ${{ runner.temp }}/dars-windows-review/
          retention-days: 1
          if-no-files-found: error
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
      - run: npm audit --prefix apps/web --audit-level=high
      - run: cargo install cargo-audit --version 0.23.0 --locked
      - run: cargo audit --deny yanked
