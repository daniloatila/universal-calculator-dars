[package]
name = "dars-desktop"
version = "0.2.0"
edition = "2024"
description = "Universal Calculator (DARS) desktop application"
license = "Apache-2.0"
publish = false
build = "build.rs"

[build-dependencies]
tauri-build = { version = "=2.7.6" }

[dependencies]
tauri = { version = "=2.12.7", default-features = false, features = ["wry"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security_Credentials"] }
