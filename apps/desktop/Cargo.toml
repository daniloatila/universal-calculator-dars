[package]
name = "dars-desktop"
version = "0.6.0"
edition = "2024"
description = "Universal Calculator (DARS) desktop application"
license = "Apache-2.0"
publish = false
build = "build.rs"

[build-dependencies]
tauri-build = { version = "=2.7.6" }

[dependencies]
reqwest = { version = "=0.13.5", default-features = false, features = ["native-tls", "system-proxy"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tauri = { version = "=2.12.7", default-features = false, features = ["wry"] }
tokio = { version = "=1.54.1", features = ["macros", "net", "sync", "time"] }
zeroize = "=1.9.2"

[target.'cfg(windows)'.dependencies]
webview2-com = "=0.39.1"
windows-core = "=0.62.2"
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security_Credentials",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Power",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }
