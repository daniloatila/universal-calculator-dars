[package]
name = "dars-tool-wasm"
version = "0.4.1"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["scientific"]
scientific = ["dars-universal/scientific"]
algebra = ["dars-universal/algebra"]
calculus = ["dars-universal/calculus"]
linear_algebra = ["dars-universal/linear_algebra"]
geometry = ["dars-universal/geometry"]
discrete-mathematics = ["dars-universal/discrete-mathematics"]
programmer = ["dars-universal/programmer"]
converter = ["dars-universal/converter"]
date-time = ["dars-universal/date-time"]
financial = ["dars-universal/financial"]
investment = ["dars-universal/investment"]
loans = ["dars-universal/loans"]
tax = ["dars-universal/tax"]
business = ["dars-universal/business"]

[dependencies]
dars-universal = { path = "../dars-universal", default-features = false }
wasm-bindgen = "=0.2.130"
