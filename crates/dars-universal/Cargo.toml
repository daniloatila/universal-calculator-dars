[package]
name = "dars-universal"
version = "0.5.1"
edition = "2024"
license = "Apache-2.0"
publish = false

[features]
default = ["scientific", "algebra", "calculus", "linear_algebra", "geometry", "discrete-mathematics", "programmer", "converter", "date-time", "financial", "investment", "loans", "tax", "business", "statistics", "probability", "simulation", "optimization", "physics-engineering", "graph-lab", "data-lab"]
scientific = ["dep:astro-float-num", "dep:num-bigint", "dep:num-integer", "dep:num-rational", "dep:num-traits"]
algebra = ["dep:num-bigint", "dep:num-integer", "dep:num-rational", "dep:num-traits"]
calculus = ["dep:num-bigint", "dep:num-integer", "dep:num-rational", "dep:num-traits"]
linear_algebra = ["dep:nalgebra", "dep:num-bigint", "dep:num-integer", "dep:num-rational", "dep:num-traits"]
geometry = ["dep:num-bigint", "dep:num-integer", "dep:num-rational", "dep:num-traits"]
discrete-mathematics = ["dep:num-bigint", "dep:num-integer", "dep:num-traits"]
programmer = ["dep:num-bigint", "dep:num-traits"]
converter = ["dep:num-bigint", "dep:num-integer", "dep:num-rational", "dep:num-traits"]
date-time = ["dep:jiff", "jiff/tzdb-bundle-always", "dep:jiff-tzdb"]
financial = ["finance", "dep:astro-float-num"]
investment = ["finance"]
loans = ["finance", "dep:astro-float-num"]
tax = ["finance"]
business = ["finance"]
finance = ["dep:jiff", "dep:num-bigint", "dep:num-integer", "dep:num-rational", "dep:num-traits"]

statistics = ["serde_json/raw_value", "dep:nalgebra", "dep:num-bigint", "dep:num-rational", "dep:num-traits", "dep:statrs"]
probability = ["dep:statrs", "dep:libm"]
simulation = ["probability", "dep:libm", "serde_json/raw_value"]
optimization = ["calculus"]
physics-engineering = ["converter"]
graph-lab = ["calculus"]
data-lab = ["converter", "serde_json/raw_value", "dep:csv", "dep:zip", "dep:quick-xml", "dep:sha2", "dep:num-bigint", "dep:num-rational", "dep:num-traits", "dep:jiff"]

[dependencies]
csv = { version = "=1.4.0", optional = true }
zip = { version = "=9.8.2", default-features = false, features = ["deflate-flate2-zlib-rs"], optional = true }
quick-xml = { version = "=0.42.0", default-features = false, optional = true }
sha2 = { version = "=0.10.9", optional = true }
statrs = { version = "=0.18.0", default-features = false, optional = true }
libm = { version = "=0.2.16", default-features = false, optional = true }
astro-float-num = { version = "=0.3.6", default-features = false, features = ["std"], optional = true }
jiff = { version = "=1.0.3", default-features = false, features = ["std"], optional = true }
jiff-tzdb = { version = "=1.0.0", optional = true }
nalgebra = { version = "=0.35.0", default-features = false, features = ["std"], optional = true }
num-bigint = { version = "0.4.8", optional = true }
num-integer = { version = "0.1.46", optional = true }
num-rational = { version = "0.4.2", optional = true }
num-traits = { version = "0.2.19", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
